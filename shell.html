<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Toysverse</title>
  <link rel="icon" type="image/png" href="images/background/toysverse-logo.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    #site-frame {
      display: block;
      width: 100vw;
      height: 100vh;
      border: none;
    }
  </style>
</head>
<body>
  <iframe id="site-frame" src="index.html" title="Toysverse Website"></iframe>

  <audio id="bg-music" loop preload="auto">
    <source src="Backgroundmusic.mp3" type="audio/mpeg">
  </audio>

  <script>
    const music = document.getElementById("bg-music");
    const siteFrame = document.getElementById("site-frame");

    music.volume = 0.25;
    let userPaused = false;

    function broadcastState() {
      const isPlaying = !music.paused;
      if (siteFrame.contentWindow) {
        siteFrame.contentWindow.postMessage({ type: "MUSIC_STATE", isPlaying }, "*");
      }
    }

    async function toggleMusic() {
      if (music.paused) {
        userPaused = false;
        try {
          await music.play();
        } catch (_) {}
      } else {
        userPaused = true;
        music.pause();
      }
      broadcastState();
    }

    function startOnFirstInteraction() {
      if (music.paused && !userPaused) {
        music.play().then(broadcastState).catch(() => {});
      }
    }

    window.addEventListener("pointerdown", startOnFirstInteraction);

    siteFrame.addEventListener("load", () => {
      broadcastState();
      try {
        siteFrame.contentWindow.addEventListener("pointerdown", startOnFirstInteraction);
      } catch (_) {}
    });

    window.addEventListener("message", (event) => {
      if (!event.data) return;

      if (event.data.type === "TOGGLE_MUSIC") {
        toggleMusic();
      } else if (event.data.type === "GET_MUSIC_STATE") {
        broadcastState();
      }
    });
  </script>
</body>
</html>
